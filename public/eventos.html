<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventos — Reino de Claudonia</title><style>body{margin:0;background:#0d1320;color:#f4ead0;font:16px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}h1{color:#e7c66f}.hero,.card{background:#182235;border:1px solid #34445f;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.tag{display:inline-block;background:#9a762e;color:#fff;padding:4px 8px;border-radius:20px;font-size:12px}a{color:#e7c66f}.muted{opacity:.75}</style></head><body><main class="wrap"><h1>📅 Calendário de Claudonia</h1><p class="muted">Eventos e atividades rotativas do reino. A trilha sazonal é gratuita; não há venda de poder.</p><section id="active" class="hero">Carregando evento ativo…</section><h2>Próximos eventos</h2><section id="calendar" class="grid"></section><p><a href="/">← Voltar ao jogo</a></p></main><script>const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));fetch('/api/live-ops/calendar').then(r=>r.json()).then(d=>{const a=d.activeEvent;document.querySelector('#active').innerHTML='<span class="tag">ATIVO</span><h2>'+e(a.name)+'</h2><p>'+e(a.rewardText)+'</p><small>Até '+new Date(a.end).toLocaleString('pt-BR')+'</small>';document.querySelector('#calendar').innerHTML=d.calendar.map(x=>'<article class="card"><b>'+e(x.name)+'</b><p>'+e(x.rewardText)+'</p><small>'+new Date(x.start).toLocaleString('pt-BR')+' — '+new Date(x.end).toLocaleTimeString('pt-BR')+'</small></article>').join('');}).catch(()=>document.querySelector('#active').textContent='Calendário temporariamente indisponível.');</script></body></html>
