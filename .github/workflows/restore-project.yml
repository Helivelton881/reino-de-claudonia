name: Restore Reino de Claudonia

on:
  push:
    branches:
      - upload-projeto-completo
    paths:
      - ".github/workflows/restore-project.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .restore/p00 .restore/p01 .restore/p02 .restore/p03 .restore/p04 .restore/p05 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.xz
          mkdir -p /tmp/reino-project
          tar -xJf /tmp/project.tar.xz -C /tmp/reino-project
          test -f /tmp/reino-project/package.json
          test -f /tmp/reino-project/server.js
          test -f /tmp/reino-project/public/index.html
          test -f /tmp/reino-project/supabase/001_ilha_verde.sql

      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/reino-project/. .
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete Reino de Claudonia project"
          git push origin HEAD:main
