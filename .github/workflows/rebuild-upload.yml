name: Rebuild uploaded project

on:
  push:
    branches:
      - upload-projeto-completo
    paths:
      - ".upload/**"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild project from upload bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/part*.txt | tr -d '\r\n ' | base64 --decode > /tmp/reino-project.tar.xz
          mkdir -p /tmp/reino-project
          tar -xJf /tmp/reino-project.tar.xz -C /tmp/reino-project
          cp -a /tmp/reino-project/. .
          rm -rf .upload .restore
          rm -f .github/workflows/restore-project.yml

      - name: Commit restored project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Upload Reino de Claudonia project"
          git push
